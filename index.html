<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huellas del Valle · Citas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Clínica Veterinaria Huellas del Valle</h1>
  <p>Sistema de agendamiento de citas · Cali</p>
</header>
<nav>
  <button class="activo" data-vista="agendar">Agendar cita</button>
  <button data-vista="agenda">Agenda del día</button>
  <button data-vista="franjas">Franjas y cupos</button>
</nav>

<main>
  <!-- VISTA 1: AGENDAR -->
  <section id="agendar" class="vista activa">
    <div class="tarjeta">
      <form id="form">
        <div class="grid">
          <div><label for="propietario">Propietario</label><input id="propietario" name="propietario" required></div>
          <div><label for="correo">Correo</label><input id="correo" name="correo" type="email" required></div>
          <div><label for="mascota">Mascota</label><input id="mascota" name="mascota" required></div>
          <div><label for="especie">Especie</label>
            <select id="especie" name="especie"><option value="perro">Perro</option><option value="gato">Gato</option></select></div>
          <div><label for="servicio">Servicio</label>
            <select id="servicio" name="servicio">
              <option>Consulta general</option><option>Vacunación</option><option>Baño</option><option>Ecografía</option>
            </select></div>
          <div><label for="fecha">Fecha</label><input id="fecha" name="fecha" type="date" required></div>
          <div><label for="hora">Hora</label>
            <select id="hora" name="hora">
              <option>08:00</option><option>09:00</option><option>10:00</option><option>11:00</option>
              <option>12:00</option><option>14:00</option><option>15:00</option><option>16:00</option>
            </select></div>
        </div>
        <div class="acciones">
          <button class="btn" type="submit" id="btnAgendar">Agendar</button>
          <button class="btn sec" type="reset">Limpiar</button>
        </div>
      </form>
      <p class="nota" style="margin-top:16px">Casos de prueba (solo llenan el formulario; se agenda con el botón):</p>
      <div class="chips" id="casos"></div>
    </div>
    <div class="resultado" id="resultado"></div>
  </section>

  <!-- VISTA 2: AGENDA DEL DÍA -->
  <section id="agenda" class="vista">
    <div class="tarjeta">
      <div class="fila-ctrl">
        <div class="campo"><label for="fechaAgenda">Fecha</label><input id="fechaAgenda" type="date"></div>
        <button class="btn sec" type="button" id="agHoy">Hoy</button>
        <button class="btn sec" type="button" id="agManana">Mañana</button>
        <button class="btn" type="button" id="agRecargar">↻ Actualizar</button>
        <span class="actualizado" id="agActualizado"></span>
      </div>
      <p class="nota" style="margin:12px 0 0">Días con citas registradas:</p>
      <div class="chips" id="agDias"></div>
    </div>
    <div class="kpis" id="agKpis"></div>
    <div class="tarjeta" id="tablaAgenda"><p class="vacio">Cargando…</p></div>
  </section>

  <!-- VISTA 3: FRANJAS -->
  <section id="franjas" class="vista">
    <div class="tarjeta">
      <div class="fila-ctrl">
        <div class="campo"><label for="fechaFranja">Fecha</label><input id="fechaFranja" type="date"></div>
        <button class="btn sec" type="button" id="frHoy">Hoy</button>
        <button class="btn sec" type="button" id="frManana">Mañana</button>
        <button class="btn" type="button" id="frRecargar">↻ Actualizar</button>
        <span class="actualizado" id="frActualizado"></span>
      </div>
      <p class="nota" style="margin:12px 0 0">Días con franjas abiertas en la agenda:</p>
      <div class="chips" id="frDias"></div>
    </div>
    <div class="tarjeta" id="tablaFranjas"><p class="vacio">Cargando…</p></div>
  </section>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
